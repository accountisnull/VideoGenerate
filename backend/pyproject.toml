[project]
name = "video-generate-backend"
version = "0.1.0"
description = "Local video generation API and integration worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
content = [
    "deepagents==0.7.16",
    "langchain-openai==1.6.2",
]
similarity-probe = [
    "qdrant-client>=1.14,<2",
    "sentence-transformers>=3,<6",
]
similarity = [
    "mcp>=1.20,<2",
    "qdrant-client==1.19.1",
    "sentence-transformers==5.7.0",
]

[dependency-groups]
dev = [
    "mcp>=1.20,<2",
    "pytest==9.1.1",
    "qdrant-client==1.19.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=../data/tmp/pytest"
